<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Digital Frame - 电子相框</title>
  <!-- 自定义样式（不依赖 Tailwind，兼容 iOS 12） -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 轮播背景 -->
  <div id="slideshow-container">
    <div id="slideshow-image" alt="slideshow"></div>
    <!-- 上一张按钮 -->
    <button id="btn-prev" class="nav-btn nav-btn-left" onclick="handleManualPrev()" aria-label="上一张">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <!-- 下一张按钮 -->
    <button id="btn-next" class="nav-btn nav-btn-right" onclick="handleManualNext()" aria-label="下一张">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>

  <!-- 遮罩层 - 提升文字可读性 -->
  <div id="overlay"></div>

  <!-- 时钟组件 - 右上角 -->
  <div id="clock-container">
    <div id="clock-time">00:00:00</div>
    <div id="clock-date">----年--月--日 星期-</div>
  </div>

  <!-- 天气组件 - 左下角 -->
  <div id="weather-container" class="hidden">
    <div id="weather-temp">--°C</div>
    <div id="weather-desc">--</div>
    <div id="weather-wind">--</div>
  </div>

  <!-- 版本号 - 右下角（从后端 API 动态获取） -->
  <div id="version-container">
    Ver:<span id="version-text">--</span>
  </div>

  <!-- 加载提示 -->
  <div id="loading-indicator">
    <div id="loading-text">加载中...</div>
  </div>

  <!-- JavaScript 模块 -->
  <script src="js/config.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/slideshow.js"></script>
  <script>
    // 从后端获取版本号
    function fetchVersion() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', '/api/health', true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            document.getElementById('version-text').textContent = 'v' + data.version;
          } catch(e) {}
        }
      };
      xhr.send();
    }

    // 应用启动
    document.addEventListener('DOMContentLoaded', function() {
      // 获取版本号
      fetchVersion();
      // 初始化时钟
      initClock();
      // 初始化天气
      initWeather();
      // 初始化轮播
      initSlideshow();
      // 隐藏加载提示
      setTimeout(function() {
        var el = document.getElementById('loading-indicator');
        if (el) {
          el.className = el.className.replace(/\bhidden\b/g, '').trim();
          el.className += ' hidden';
        }
      }, 500);
    });
  </script>
</body>
</html>
