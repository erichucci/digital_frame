<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Digital Frame - 电子相框</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 自定义样式 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="m-0 p-0 overflow-hidden bg-black w-screen h-screen">
  <!-- 轮播背景 -->
  <div id="slideshow-container" class="absolute inset-0 w-full h-full">
    <img id="slideshow-image" class="absolute inset-0 w-full h-full object-cover" alt="slideshow">
    <!-- 上一张按钮 -->
    <button id="btn-prev" class="nav-btn nav-btn-left" onclick="handleManualPrev()" aria-label="上一张">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <!-- 下一张按钮 -->
    <button id="btn-next" class="nav-btn nav-btn-right" onclick="handleManualNext()" aria-label="下一张">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>

  <!-- 遮罩层 - 提升文字可读性 -->
  <div class="absolute inset-0 bg-gradient-to-t from-black/30 via-transparent to-black/20 pointer-events-none"></div>

  <!-- 时钟组件 - 左上角 -->
  <div id="clock-container" class="absolute top-6 left-6 text-white select-none">
    <div id="clock-time" class="text-7xl font-bold tracking-wider drop-shadow-lg">00:00:00</div>
    <div id="clock-date" class="text-2xl mt-2 font-light tracking-wide drop-shadow-md">----年--月--日 星期-</div>
  </div>

  <!-- 天气组件 - 右上角 -->
  <div id="weather-container" class="absolute top-6 right-6 text-white text-right select-none hidden">
    <div id="weather-temp" class="text-5xl font-bold drop-shadow-lg">--°C</div>
    <div id="weather-desc" class="text-xl mt-1 font-light drop-shadow-md">--</div>
    <div id="weather-wind" class="text-base mt-1 opacity-80 drop-shadow-sm">--</div>
  </div>

  <!-- 版本号 - 右下角 -->
  <div id="version-container" class="absolute bottom-4 right-4 text-white/40 text-sm font-light select-none">
    Ver:<span id="version-text">v0.1.0</span>
  </div>

  <!-- 加载提示 -->
  <div id="loading-indicator" class="absolute inset-0 flex items-center justify-center bg-black">
    <div class="text-white/60 text-lg animate-pulse">加载中...</div>
  </div>

  <!-- JavaScript 模块 -->
  <script src="js/config.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/slideshow.js"></script>
  <script>
    // 应用启动
    document.addEventListener('DOMContentLoaded', function() {
      // 初始化时钟
      initClock();
      // 初始化天气
      initWeather();
      // 初始化轮播
      initSlideshow();
      // 隐藏加载提示
      setTimeout(function() {
        document.getElementById('loading-indicator').classList.add('hidden');
      }, 500);
    });
  </script>
</body>
</html>
